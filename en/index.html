<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBuddy - Your AI Study Partner</title>
<link rel="alternate" hreflang="en" href="https://loricalliku18-ops.github.io/Studybuddy/en/" />
<link rel="alternate" hreflang="sq" href="https://loricalliku18-ops.github.io/Studybuddy/" />
<style>
html{scroll-behavior:smooth}
body{font-family:sans-serif;background:#faf5ff;margin:0;padding:10px}
.top{background:#2563eb;color:#fff;padding:12px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;padding:24px;border-radius:16px;margin:14px 0;box-shadow:0 4px 14px rgba(0,0,0,.07);text-align:center}
.teacher{background:#f3e8ff;border:2px solid #d8b4fe;padding:16px;border-radius:16px;margin:14px 0;scroll-margin-top:20px}
.btn-start{background:#2563eb;color:#fff;padding:14px 28px;border-radius:12px;border:none;font-weight:800;font-size:16px;cursor:pointer;display:inline-block;text-decoration:none}
.lang{border-radius:20px;padding:6px 14px;font-weight:700;text-decoration:none;background:#fff;color:#2563eb}
</style>
</head>
<body>

<div class="top">
<span>📚 StudyBuddy</span>
<div>
<a href="https://loricalliku18-ops.github.io/Studybuddy/" class="lang">AL</a>
<a href="https://loricalliku18-ops.github.io/Studybuddy/en/" class="lang" style="background:#9333ea;color:#fff">EN</a>
</div>
</div>

<div class="card">
<h1>📚 StudyBuddy</h1>
<h2 style="color:#2563eb;margin:6px 0">Your AI Study Partner</h2>
<p>Made with love for students across Europe.</p>
<a href="#mira" class="btn-start">Start Studying Now</a>
</div>

<div id="mira" class="teacher">
<h2 style="color:#6b21a8;margin:0">Teacher Mira 🤖 - Your AI Tutor</h2>
<p style="margin:6px 0 0">Virtual character inspired by Mira Murati - Albanian pride</p>
</div>

<script>
// Siguron që butoni të punojë edhe në iPhone
document.querySelectorAll('a[href="#mira"]').forEach(a=>{
  a.addEventListener('click',function(e){
    e.preventDefault();
    document.getElementById('mira').scrollIntoView({behavior:'smooth'});
  });
});
</script>

</body>
</html>
